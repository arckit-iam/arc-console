<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ARC Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside id="topbar" hidden>
      <div class="brand">
        <span class="logo" aria-hidden="true">A</span>
        <span class="brand-name">ARC <small>Console</small></span>
      </div>
      <nav id="nav" aria-label="Navigation principale"></nav>
      <div class="session">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <div class="who">
          <strong id="whoami"></strong>
          <small id="roles"></small>
        </div>
        <button id="logout" type="button" class="ghost" title="Se déconnecter">Quitter</button>
      </div>
    </aside>

    <div id="message" role="alert" hidden></div>

    <main id="main"><noscript>Cette console nécessite JavaScript.</noscript></main>

    <script src="/app.js" defer></script>
  </body>
</html>
