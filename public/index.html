<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARC Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header id="topbar" hidden>
      <h1>ARC Console</h1>
      <nav id="nav" aria-label="Navigation principale"></nav>
      <div class="session">
        <span id="whoami"></span>
        <button id="logout" type="button" class="secondary">Se déconnecter</button>
      </div>
    </header>

    <div id="message" role="alert" hidden></div>

    <main id="main"><noscript>Cette console nécessite JavaScript.</noscript></main>

    <script src="/app.js" defer></script>
  </body>
</html>
